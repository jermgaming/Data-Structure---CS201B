name: Auto-generate README for C files with AI

on:
  push:
    paths:
      - '**/*.c'

jobs:
  generate-readme:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      # NEW: Install Ollama
      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          sleep 5
          ollama pull llama3.2  # or codellama, mistral, etc.
      
      # NEW: Install GCC for compiling C programs
      - name: Install GCC
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc
      
      - name: Install dependencies
        run: |
          pip install requests
      
      - name: Generate README files with AI
        run: |
          python3 << 'EOF'
          import os
          import json
          import requests
          import subprocess
          import tempfile

          def get_modified_c_files():
              """Get list of modified/added .c files"""
              result = subprocess.run(
                  ['git', 'diff', '--name-only', '--diff-filter=AM', 'HEAD^', 'HEAD'],
                  capture_output=True,
                  text=True
              )
              files = [f for f in result.stdout.strip().split('\n') if f.endswith('.c')]
              return files

          def read_file_content(filepath):
              """Read content of a file"""
              try:
                  with open(filepath, 'r', encoding='utf-8') as f:
                      return f.read()
              except Exception as e:
                  print(f"Error reading {filepath}: {e}")
                  return None

          def call_ollama(prompt, model='llama3.2'):
              """Call local Ollama API"""
              try:
                  response = requests.post(
                      'http://localhost:11434/api/generate',
                      json={
                          'model': model,
                          'prompt': prompt,
                          'stream': False
                      },
                      timeout=120
                  )
                  
                  if response.status_code == 200:
                      return response.json()['response']
                  else:
                      print(f"❌ Ollama API error: {response.status_code}")
                      return None
              except Exception as e:
                  print(f"❌ Error calling Ollama: {e}")
                  return None

          def compile_and_run_examples(filepath, filename):
              """Compile C program and run with example inputs"""
              examples = []
              
              try:
                  # Compile the program
                  exe_name = f"/tmp/{filename}"
                  compile_result = subprocess.run(
                      ['gcc', filepath, '-o', exe_name],
                      capture_output=True,
                      text=True,
                      timeout=30
                  )
                  
                  if compile_result.returncode != 0:
                      print(f"⚠️  Compilation failed: {compile_result.stderr}")
                      return None
                  
                  print(f"✅ Compiled {filename}")
                  
                  # Generate 2 example inputs using AI
                  input_prompt = f"""Based on this C program, generate 2 different example inputs that would demonstrate its functionality.

          Program: {filename}

          Provide the inputs in this format:
          Example 1:
          [input here]

          Example 2:
          [input here]

          Keep inputs simple and realistic. If the program doesn't need input, just say "No input needed"."""

                  ai_inputs = call_ollama(input_prompt)
                  
                  if not ai_inputs:
                      # Fallback: try empty input and basic input
                      test_inputs = ["", "5\n"]
                  else:
                      # Parse AI-generated inputs
                      test_inputs = parse_example_inputs(ai_inputs)
                  
                  # Run with each input
                  for i, test_input in enumerate(test_inputs[:2], 1):
                      try:
                          run_result = subprocess.run(
                              [exe_name],
                              input=test_input,
                              capture_output=True,
                              text=True,
                              timeout=5
                          )
                          
                          examples.append({
                              'number': i,
                              'input': test_input if test_input else '[No input]',
                              'output': run_result.stdout,
                              'stderr': run_result.stderr
                          })
                          
                          print(f"✅ Executed example {i}")
                          
                      except subprocess.TimeoutExpired:
                          examples.append({
                              'number': i,
                              'input': test_input,
                              'output': '[Program timeout - might be waiting for input or infinite loop]',
                              'stderr': ''
                          })
                      except Exception as e:
                          print(f"⚠️  Error running example {i}: {e}")
                  
                  return examples
                  
              except Exception as e:
                  print(f"❌ Error in compile_and_run: {e}")
                  return None

          def parse_example_inputs(ai_response):
              """Parse AI-generated example inputs"""
              inputs = []
              lines = ai_response.split('\n')
              current_input = []
              in_example = False
              
              for line in lines:
                  if 'Example' in line and ':' in line:
                      if current_input:
                          inputs.append('\n'.join(current_input))
                          current_input = []
                      in_example = True
                  elif in_example and line.strip():
                      if not line.startswith('Example'):
                          current_input.append(line)
              
              if current_input:
                  inputs.append('\n'.join(current_input))
              
              return inputs if inputs else ["", "5\n"]

          def generate_readme_with_ollama(code_content, filename, filepath, dry_run_examples):
              """Generate detailed README using Ollama with dry run examples"""
              
              # First: Analyze the code
              analysis_prompt = f"""Analyze this C program in detail:

          **File:** {filename}
          **Path:** {filepath}

          **CODE:**
          ```c
          {code_content}
          ```

          Provide:
          1. Main purpose
          2. Data structures used
          3. Algorithm explanation
          4. Functions and their purposes
          5. Input/output requirements
          6. Time/space complexity

          Be concise but thorough."""

              print(f"🔍 Analyzing {filename} with Ollama...")
              analysis = call_ollama(analysis_prompt)
              
              if not analysis:
                  return None
              
              print(f"✅ Analysis complete")
              
              # Prepare dry run examples section
              examples_section = ""
              if dry_run_examples:
                  examples_section = "\n## 🧪 Dry Run Examples\n\n"
                  for ex in dry_run_examples:
                      examples_section += f"""### Example {ex['number']}

          **Input:**
          ```
          {ex['input']}
          ```

          **Output:**
          ```
          {ex['output']}
          ```
          """
                      if ex.get('stderr'):
                          examples_section += f"""
          **Errors/Warnings:**
          ```
          {ex['stderr']}
          ```
          """
              
              # Second: Generate README
              readme_prompt = f"""Create a comprehensive README.md for this C program.

          **ANALYSIS:**
          {analysis}

          **ORIGINAL CODE:**
          ```c
          {code_content[:1000]}...
          ```

          {examples_section}

          Create a README with these sections:
          # {filename}

          ## 📋 Overview
          ## 🎯 Purpose
          ## ✨ Key Features
          ## 🏗️ Data Structures
          ## 🔧 Implementation Details
          ## 💻 Compilation & Usage
          ## 📥 Input/Output
          ## 📊 Complexity Analysis
          {f"## 🧪 Dry Run Examples\n{examples_section}" if dry_run_examples else ""}
          ## ⚠️ Edge Cases
          ## 📝 Notes

          Make it detailed and educational."""

              print(f"📝 Generating README with Ollama...")
              readme = call_ollama(readme_prompt)
              
              if readme:
                  print(f"✅ README generated")
                  return readme
              
              return None

          def main():
              modified_files = get_modified_c_files()
              
              if not modified_files:
                  print("No .c files modified")
                  return
              
              for filepath in modified_files:
                  if not filepath:
                      continue
                      
                  directory = os.path.dirname(filepath)
                  filename = os.path.splitext(os.path.basename(filepath))[0]
                  readme_path = os.path.join(directory, f"{filename}.md")
                  
                  if os.path.exists(readme_path):
                      print(f"ℹ️  {readme_path} already exists, skipping")
                      continue
                  
                  print(f"📝 Processing: {filepath}")
                  
                  # Read C file
                  code_content = read_file_content(filepath)
                  if not code_content:
                      continue
                  
                  # Compile and run examples
                  dry_run_examples = compile_and_run_examples(filepath, filename)
                  
                  # Generate README with Ollama
                  readme_content = generate_readme_with_ollama(
                      code_content, 
                      filename, 
                      filepath,
                      dry_run_examples
                  )
                  
                  if not readme_content:
                      print(f"⚠️  Failed to generate README for {filename}")
                      continue
                  
                  # Write README
                  try:
                      with open(readme_path, 'w', encoding='utf-8') as f:
                          f.write(readme_content)
                      print(f"✅ Created: {readme_path}")
                  except Exception as e:
                      print(f"❌ Error writing {readme_path}: {e}")

          if __name__ == "__main__":
              main()
          EOF
      
      - name: Commit and push if changes exist
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          if [ -n "$(git status --porcelain)" ]; then
            git add "**/*.md"
            git commit -m "📝 Auto-generate documentation with examples [skip ci]"
            git push
            echo "✅ Documentation committed and pushed"
          else
            echo "No new README files to commit"
          fi