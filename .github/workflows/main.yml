name: Auto-generate README for C files with AI

on:
  push:
    paths:
      - '**/*.c'

jobs:
  generate-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install openai

      - name: Validate API Key exists
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "❌ ERROR: OPENROUTER_API_KEY secret is not set in this repository."
            echo "👉 Go to: Settings → Secrets and variables → Actions → New repository secret"
            echo "   Name:  OPENROUTER_API_KEY"
            echo "   Value: your OpenRouter API key from https://openrouter.ai/keys"
            exit 1
          else
            echo "✅ OPENROUTER_API_KEY secret is present."
          fi

      - name: Generate README files with AI
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python3 << 'EOF'
          import os
          import subprocess
          from openai import OpenAI

          OPENROUTER_API_KEY = os.environ["OPENROUTER_API_KEY"]

          client = OpenAI(
              base_url="https://openrouter.ai/api/v1",
              api_key=OPENROUTER_API_KEY,
          )

          def get_modified_c_files():
              check = subprocess.run(
                  ['git', 'rev-parse', '--verify', 'HEAD^'],
                  capture_output=True, text=True
              )
              if check.returncode == 0:
                  result = subprocess.run(
                      ['git', 'diff', '--name-only', '--diff-filter=AM', 'HEAD^', 'HEAD'],
                      capture_output=True, text=True
                  )
              else:
                  result = subprocess.run(
                      ['git', 'diff', '--name-only', '--diff-filter=AM', '--cached'],
                      capture_output=True, text=True
                  )
                  if not result.stdout.strip():
                      result = subprocess.run(
                          ['git', 'show', '--name-only', '--format=', 'HEAD'],
                          capture_output=True, text=True
                      )
              files = [f for f in result.stdout.strip().split('\n') if f.endswith('.c')]
              return files

          def read_file_content(filepath):
              try:
                  with open(filepath, 'r', encoding='utf-8') as f:
                      return f.read()
              except Exception as e:
                  print(f"Error reading {filepath}: {e}")
                  return None

          def generate_readme_with_ai(code_content, filename, filepath):
              analysis_prompt = f"""You are analyzing a C program for documentation purposes. Read and understand this code completely.

          **File:** {filename}
          **Path:** {filepath}

          **COMPLETE CODE:**
          ```c
          {code_content}
          ```

          Analyze this code in detail and provide:
          1. What does this program do? (main purpose)
          2. What data structures are implemented/used?
          3. List all functions with their purpose, parameters, and return values
          4. What algorithms are used?
          5. What are the inputs and outputs?
          6. Step-by-step walkthrough of the main logic
          7. Time and space complexity analysis
          8. Any edge cases or error handling
          9. Potential issues or limitations
          10. Example use cases

          Be extremely detailed and technical."""

              try:
                  print(f"🔍 Analyzing code context for {filename}...")
                  analysis_response = client.chat.completions.create(
                      model="meta-llama/llama-3.3-70b-instruct:free",
                      messages=[
                          {
                              'role': 'system',
                              'content': 'You are an expert C programmer and code analyst. Analyze code thoroughly and provide detailed technical insights.'
                          },
                          {
                              'role': 'user',
                              'content': analysis_prompt
                          }
                      ],
                      temperature=0.3,
                      max_tokens=4000
                  )

                  code_analysis = analysis_response.choices[0].message.content
                  print(f"✅ Code analysis complete")

                  readme_prompt = f"""Based on the following code analysis, create a comprehensive, well-structured README.md file.

          **CODE ANALYSIS:**
          {code_analysis}

          **ORIGINAL CODE FOR REFERENCE:**
          ```c
          {code_content}
          ```

          Create a detailed README.md with these sections:

          # {filename}

          ## 📋 Overview
          [Clear, concise description of what this program does]

          ## 🎯 Purpose
          [Why this program exists and what problem it solves]

          ## ✨ Key Features
          [Bullet points of main features and capabilities]

          ## 🏗️ Data Structures Used
          [Detailed explanation of data structures]

          ## 🔧 Implementation Details

          ### Algorithm Explanation
          [Step-by-step breakdown]

          ### Functions Documentation
          Document each function with purpose, parameters, return values, and logic.

          ## 💻 Compilation & Usage

          ### Compilation
          ```bash
          gcc "{filename}.c" -o {filename}
          ```

          ### Running
          ```bash
          ./{filename}
          ```

          ## 📥 Input/Output
          Describe inputs and outputs.

          ## 📊 Complexity Analysis
          - **Time Complexity**: [with explanation]
          - **Space Complexity**: [with explanation]

          ## 🧪 Example Run
          Show sample execution with expected output.

          ## ⚠️ Edge Cases & Error Handling

          ## 🚧 Limitations

          ## 📝 Notes

          Be specific, technical, and educational. Use emojis for headers."""

                  print(f"📝 Generating README documentation...")
                  readme_response = client.chat.completions.create(
                      model="meta-llama/llama-3.3-70b-instruct:free",
                      messages=[
                          {
                              'role': 'system',
                              'content': 'You are an expert technical writer. Create clear, detailed, well-structured documentation in Markdown format.'
                          },
                          {
                              'role': 'user',
                              'content': readme_prompt
                          }
                      ],
                      temperature=0.7,
                      max_tokens=8000
                  )

                  print(f"✅ README generated successfully")
                  return readme_response.choices[0].message.content

              except Exception as e:
                  print(f"❌ Error calling OpenRouter API: {e}")
                  return None

          def create_basic_readme(filename, filepath, code_content):
              return f"""# {filename}

          ## Description
          This C program is located at `{filepath}`.

          ## Code
          ```c
          {code_content[:500]}...
          ```

          ## Compilation
          ```bash
          gcc "{filename}.c" -o {filename}
          ```

          ## Usage
          ```bash
          ./{filename}
          ```

          ## Notes
          - Auto-generated README (API key not configured for detailed analysis)
          - Please add detailed documentation manually
          """

          def generate_commit_message(files_processed, code_summaries):
              if not code_summaries:
                  return "📝 Auto-generate documentation for C programs [skip ci]"

              files_summary = "\n\n".join([
                  f"**File:** {info['filename']}\n**Path:** {info['filepath']}\n**Summary:** {info['summary']}"
                  for info in code_summaries
              ])

              prompt = f"""Generate a concise, specific Git commit message for auto-generated documentation.

          The following C programs had their documentation generated:

          {files_summary}

          Create a commit message that:
          1. Starts with an emoji
          2. Briefly describes what documentation was added
          3. Mentions the number of files if more than one
          4. Ends with [skip ci]
          5. Keep it under 72 characters

          Generate ONLY the commit message, nothing else."""

              try:
                  response = client.chat.completions.create(
                      model="meta-llama/llama-3.3-70b-instruct:free",
                      messages=[
                          {
                              'role': 'system',
                              'content': 'You are a Git commit message expert.'
                          },
                          {
                              'role': 'user',
                              'content': prompt
                          }
                      ],
                      temperature=0.5,
                      max_tokens=100
                  )

                  commit_msg = response.choices[0].message.content.strip()
                  if '[skip ci]' not in commit_msg:
                      commit_msg += ' [skip ci]'
                  print(f"✅ Generated commit message: {commit_msg}")
                  return commit_msg

              except Exception as e:
                  print(f"⚠️  Error generating commit message: {e}")
                  return "📝 Auto-generate documentation for C programs [skip ci]"

          def extract_code_summary(code_content):
              lines = code_content.split('\n')
              summary_lines = []
              in_comment = False

              for line in lines[:30]:
                  line = line.strip()
                  if line.startswith('/*'):
                      in_comment = True
                  if in_comment:
                      clean_line = line.replace('/*', '').replace('*/', '').replace('*', '').strip()
                      if clean_line and not clean_line.startswith('#'):
                          summary_lines.append(clean_line)
                  if '*/' in line:
                      in_comment = False
                      if summary_lines:
                          break
                  if line.startswith('//'):
                      clean_line = line.replace('//', '').strip()
                      if clean_line:
                          summary_lines.append(clean_line)

              if summary_lines:
                  return ' '.join(summary_lines[:3])
              return "C program implementation"

          def main():
              modified_files = get_modified_c_files()

              if not modified_files:
                  print("No .c files modified")
                  return

              code_summaries = []

              for filepath in modified_files:
                  if not filepath:
                      continue

                  directory = os.path.dirname(filepath)
                  filename = os.path.splitext(os.path.basename(filepath))[0]
                  readme_path = os.path.join(directory, f"{filename}.md")

                  if os.path.exists(readme_path):
                      print(f"ℹ️  {readme_path} already exists, skipping")
                      continue

                  print(f"📝 Processing: {filepath}")
                  code_content = read_file_content(filepath)

                  if not code_content:
                      print(f"⚠️  Could not read {filepath}")
                      continue

                  code_summary = extract_code_summary(code_content)
                  code_summaries.append({
                      'filename': filename,
                      'filepath': filepath,
                      'summary': code_summary
                  })

                  readme_content = generate_readme_with_ai(code_content, filename, filepath)

                  if not readme_content:
                      print(f"⚠️  Falling back to basic README for {filename}")
                      readme_content = create_basic_readme(filename, filepath, code_content)

                  try:
                      with open(readme_path, 'w', encoding='utf-8') as f:
                          f.write(readme_content)
                      print(f"✅ Created: {readme_path}")
                  except Exception as e:
                      print(f"❌ Error writing {readme_path}: {e}")

              if code_summaries:
                  commit_message = generate_commit_message(len(modified_files), code_summaries)
                  with open('/tmp/commit_message.txt', 'w') as f:
                      f.write(commit_message)
                  print(f"💬 Commit message: {commit_message}")

          if __name__ == "__main__":
              main()
          EOF

      - name: Commit and push if changes exist
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          find . -name "*.md" -not -path "./.git/*" -print0 | xargs -0 git add --
          if [ -n "$(git status --porcelain)" ]; then
            if [ -f /tmp/commit_message.txt ]; then
              COMMIT_MSG=$(cat /tmp/commit_message.txt)
              echo "Using AI-generated commit message: $COMMIT_MSG"
              git commit -m "$COMMIT_MSG"
            else
              echo "Using default commit message"
              git commit -m "📝 Auto-generate documentation [skip ci]"
            fi
            git push
            echo "✅ Documentation committed and pushed successfully"
          else
            echo "No new README files to commit"
          fi
